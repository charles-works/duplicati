name: Build Docker image (linux/amd64)

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Publish Duplicati server for linux-x64
        run: |
          set -euo pipefail
          mkdir -p docker-context/amd64

          dotnet publish Executables/Duplicati.Server/Duplicati.Server.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output docker-context/amd64

      - name: Prepare Docker context
        run: |
          set -euo pipefail

          echo "Published files:"
          find docker-context/amd64 -maxdepth 1 -type f -printf '%f\n'

          executable="$(find docker-context/amd64 -maxdepth 1 -type f -executable \
            ! -name '*.dll' \
            ! -name '*.json' \
            ! -name '*.pdb' \
            | head -n 1)"

          if [ -z "$executable" ]; then
            echo "No executable was found in docker-context/amd64"
            exit 1
          fi

          mv "$executable" docker-context/amd64/duplicati-server
          chmod +x docker-context/amd64/duplicati-server

          cp ReleaseBuilder/Resources/Docker/run-as-user.sh docker-context/run-as-user.sh
          cp ReleaseBuilder/Resources/Docker/Dockerfile docker-context/Dockerfile

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: docker-context/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CHANNEL=canary
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
